<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Verdict — Movie Review Sentiment Analyzer</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #18181b;
    --film-amber: #e8b04b;
    --positive: #4ade80;
    --negative: #f87171;
    --text-main: #f4f4f5;
    --text-dim: #9ca3af;
    --border: #2a2a2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 38px, rgba(255,255,255,0.025) 38px 40px);
  }

  .filmstrip {
    height: 28px;
    background: repeating-linear-gradient(
      to right,
      #000 0 18px,
      var(--bg) 18px 40px
    );
    border-bottom: 1px solid var(--border);
  }

  header {
    text-align: center;
    padding: 48px 20px 24px;
  }

  .eyebrow {
    font-family: 'Courier New', monospace;
    letter-spacing: 0.3em;
    font-size: 0.7rem;
    color: var(--film-amber);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  h1 .accent { color: var(--film-amber); font-style: italic; }

  .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
    margin-top: 10px;
    font-family: 'Courier New', monospace;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 150px;
    background: #0b0b0d;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-main);
    padding: 14px;
    font-family: 'Georgia', serif;
    font-size: 1rem;
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.2s ease;
  }

  textarea:focus {
    outline: none;
    border-color: var(--film-amber);
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .toggle-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
  }

  .toggle-group button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .toggle-group button.active {
    background: var(--film-amber);
    color: #1a1a1a;
    font-weight: bold;
  }

  .analyze-btn {
    background: var(--film-amber);
    color: #1a1a1a;
    border: none;
    padding: 12px 28px;
    font-family: 'Georgia', serif;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .analyze-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(232,176,75,0.25); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Results */
  .result-card { display: none; }
  .result-card.visible { display: block; animation: reveal 0.4s ease; }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .verdict {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .verdict-stamp {
    font-family: 'Courier New', monospace;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    padding: 10px 22px;
    border-radius: 4px;
    text-transform: uppercase;
    border: 3px solid currentColor;
    transform: rotate(-3deg);
  }

  .verdict-stamp.positive { color: var(--positive); }
  .verdict-stamp.negative { color: var(--negative); }

  .verdict-emoji { font-size: 2.2rem; }

  .meter-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .meter-track {
    height: 10px;
    background: #0b0b0d;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .meter-fill {
    height: 100%;
    border-radius: 6px;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .meter-fill.positive { background: linear-gradient(90deg, #22c55e, var(--positive)); }
  .meter-fill.negative { background: linear-gradient(90deg, #ef4444, var(--negative)); }

  .meta-row {
    display: flex;
    gap: 24px;
    margin-top: 18px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .meta-row strong { color: var(--text-main); }

  .error-box {
    display: none;
    background: rgba(248,113,113,0.1);
    border: 1px solid var(--negative);
    color: var(--negative);
    padding: 14px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    margin-top: 16px;
  }

  .error-box.visible { display: block; }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-dim);
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(26,26,26,0.3);
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="filmstrip"></div>

<header>
  <div class="eyebrow">Scene One · Take One · Action</div>
  <h1>Reel <span class="accent">Verdict</span></h1>
  <p class="subtitle">// sentiment analysis for movie reviews</p>
</header>

<main>
  <div class="card">
    <label for="review-input">Your review</label>
    <textarea id="review-input" placeholder="Paste a movie review here... e.g. &quot;The cinematography was stunning but the plot dragged on far too long.&quot;"></textarea>

    <div class="controls">
      <div class="toggle-group" id="model-toggle">
        <button class="active" data-model="classical">Classical ML</button>
        <button data-model="transformer">Transformer</button>
      </div>
      <button class="analyze-btn" id="analyze-btn">Analyze Sentiment</button>
    </div>

    <div class="error-box" id="error-box"></div>
  </div>

  <div class="card result-card" id="result-card">
    <div class="verdict">
      <span class="verdict-emoji" id="verdict-emoji">😊</span>
      <span class="verdict-stamp positive" id="verdict-stamp">POSITIVE</span>
    </div>

    <div class="meter-label">
      <span>Confidence</span>
      <span id="confidence-value">0%</span>
    </div>
    <div class="meter-track">
      <div class="meter-fill positive" id="meter-fill"></div>
    </div>

    <div class="meta-row">
      <span>Model: <strong id="model-used">—</strong></span>
      <span>Processing time: <strong id="processing-time">—</strong></span>
    </div>
  </div>
</main>

<footer>
  REEL VERDICT — BUILT WITH FLASK + SCIKIT-LEARN + TRANSFORMERS
</footer>

<script>
  let selectedModel = 'classical';

  const toggleBtns = document.querySelectorAll('#model-toggle button');
  toggleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      toggleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedModel = btn.dataset.model;
    });
  });

  const analyzeBtn = document.getElementById('analyze-btn');
  const reviewInput = document.getElementById('review-input');
  const resultCard = document.getElementById('result-card');
  const errorBox = document.getElementById('error-box');

  analyzeBtn.addEventListener('click', async () => {
    const review = reviewInput.value.trim();
    errorBox.classList.remove('visible');

    if (!review) {
      errorBox.textContent = 'ERROR: Please enter a review before analyzing.';
      errorBox.classList.add('visible');
      return;
    }

    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<span class="spinner"></span>Analyzing...';
    resultCard.classList.remove('visible');

    try {
      const response = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review: review, model: selectedModel })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Something went wrong.');
      }

      renderResult(data);
    } catch (err) {
      errorBox.textContent = 'ERROR: ' + err.message;
      errorBox.classList.add('visible');
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = 'Analyze Sentiment';
    }
  });

  function renderResult(data) {
    const isPositive = data.sentiment === 'positive';

    const stamp = document.getElementById('verdict-stamp');
    stamp.textContent = data.sentiment.toUpperCase();
    stamp.classList.toggle('positive', isPositive);
    stamp.classList.toggle('negative', !isPositive);

    document.getElementById('verdict-emoji').textContent = isPositive ? '😊' : '😞';

    const pct = Math.round(data.confidence * 100);
    document.getElementById('confidence-value').textContent = pct + '%';

    const fill = document.getElementById('meter-fill');
    fill.classList.toggle('positive', isPositive);
    fill.classList.toggle('negative', !isPositive);
    fill.style.width = '0%';
    requestAnimationFrame(() => { fill.style.width = pct + '%'; });

    document.getElementById('model-used').textContent = data.model_used;
    document.getElementById('processing-time').textContent = data.processing_time_ms + ' ms';

    resultCard.classList.add('visible');
  }

  reviewInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.ctrlKey) {
      analyzeBtn.click();
    }
  });
</script>

</body>
</html>
